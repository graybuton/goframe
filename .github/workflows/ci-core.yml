name: Core

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  go:
    name: Go and GOX checks (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            go: '1.26.6'
            tier: supported
            full: true
          - os: ubuntu-latest
            go: '1.27.0'
            tier: supported
            full: true
          - os: macos-15-intel
            go: '1.26.6'
            tier: host
            full: false
          - os: windows-latest
            go: '1.26.6'
            tier: host
            full: false

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Verify Windows Go toolchain integrity
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./.github/scripts/ensure-go-toolchain.ps1 `
            -Version '${{ matrix.go }}' `
            -Architecture 'amd64'

      - name: Test Windows Go toolchain integrity helper
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/ensure-go-toolchain.tests.ps1

      - name: Test security runner with system Bash
        if: runner.os == 'macOS'
        run: |
          /bin/bash --version
          /bin/bash -n scripts/security-analysis.sh
          /bin/bash -n .github/scripts/security-analysis-runner.tests.sh
          /bin/bash .github/scripts/security-analysis-runner.tests.sh

      - name: Setup Node.js
        if: matrix.full
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.18.1'

      - name: CI supply-chain gate
        if: matrix.full
        run: |
          scripts/ci-supply-chain-check.sh
          .github/scripts/ci-supply-chain-check.tests.sh

      - name: Artifact gate
        if: matrix.full
        run: scripts/artifact-check.sh

      - name: Module path gate
        if: matrix.full
        run: scripts/module-path-check.sh

      - name: Docs consistency
        if: matrix.full
        run: node scripts/docs-check.mjs

      - name: Format
        run: |
          go fmt ./...
          git diff --exit-code

      - name: Test
        run: go test ./...

      - name: Race test
        if: matrix.full
        run: go test -race ./pkg/... ./cmd/...

      - name: Vet
        run: go vet ./...

      - name: Debug-tag test
        run: go test -tags=goframe_debug ./...

      - name: GOX golden tests
        run: go test ./pkg/gox -run 'TestGolden|TestErrorGolden'

  tinygo-parity:
    name: TinyGo source selection (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go:
          - '1.26.6'

    env:
      TINYGO_VERSION: 0.42.0
      TINYGO_SHA256: 2082c4762fea6d5cc4cd1f4a243eaacf07b12f576717d4c6b74828bd163cb563

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Install TinyGo
        run: |
          curl -fsSL -o /tmp/tinygo.deb "https://github.com/tinygo-org/tinygo/releases/download/v${TINYGO_VERSION}/tinygo_${TINYGO_VERSION}_amd64.deb"
          printf '%s  %s\n' "$TINYGO_SHA256" /tmp/tinygo.deb | sha256sum --check --strict -
          sudo apt-get install -y /tmp/tinygo.deb
          tinygo version

      - name: TinyGo source-selection parity
        run: |
          go test ./cmd/goxc \
            -run 'TestBrowser(Compiler|GOX)SourceSelectionParity|TestFeatureTaggedTinyGoBuild' \
            -count=1 \
            -v
